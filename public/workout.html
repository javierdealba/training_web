<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sesión de entrenamiento — Nombre genérico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
  <link rel="stylesheet" href="/assets/css/pages.css" />
</head>
<body data-page="workout">
  <div id="nav"></div>

  <main class="section-sm">
    <div class="container">
      <a class="faint" href="/calendario" style="font-size:13px">‹ Volver al calendario</a>

      <div class="wo-hero mt-16" id="wo-head"></div>

      <div class="workout mt-32">
        <div>
          <div class="card">
            <div class="eyebrow">La sesión</div>
            <div class="mt-16" id="wo-blocks"></div>
          </div>

          <div class="card mt-24">
            <div class="eyebrow">Técnica</div>
            <div class="video-ph mt-16">
              <div class="play">▶</div>
              <div>Video profesional del coach</div>
            </div>
          </div>
        </div>

        <aside>
          <div class="card">
            <div class="eyebrow">Registra tu resultado</div>
            <div class="mt-16" id="wo-log"></div>
          </div>
          <p class="faint mt-16" style="font-size:12.5px">
            Lo que registras alimenta tu Athlete Passport y llega a tu coach para
            la revisión de la sesión.
          </p>
        </aside>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
